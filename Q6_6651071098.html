<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VietAir - Đặt vé máy bay</title>
<style>
  :root{
    --sky:#3f7fd1;
    --sky-dark:#1f4f8a;
    --orange:#f0954a;
    --bg:#e8f1fb;
    --ink:#1f2b38;
    --muted:#63707d;
    --line:#dde6f1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%,var(--bg) 260px);
    color:var(--ink);
    padding:26px 16px 40px;
  }
  header{text-align:center;margin-bottom:20px;}
  header h1{
    display:inline-block;
    margin:0;
    color:#fff;
    font-size:1.6rem;
    font-style:italic;
    letter-spacing:.5px;
  }
  main{max-width:680px;margin:0 auto;}
  main > section{
    background:#fff;
    border-radius:14px;
    padding:30px 34px 26px;
    box-shadow:0 10px 30px rgba(31,79,138,.15);
  }
  main > section h2{
    text-align:center;
    margin-top:0;
    color:var(--sky-dark);
    font-size:1.2rem;
  }
  fieldset{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px 18px;
    margin-bottom:16px;
  }
  legend{
    padding:0 8px;
    color:var(--sky-dark);
    font-weight:700;
    font-size:.92rem;
  }
  label{
    display:block;
    font-size:.82rem;
    color:var(--muted);
    margin:10px 0 4px;
  }
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}
  input[type=text], input[type=date], input[type=number], select{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.88rem;
    background:#fafcff;
  }
  input:focus, select:focus{outline:2px solid var(--sky);outline-offset:1px;}
  output{
    display:block;
    text-align:center;
    font-size:1.3rem;
    font-weight:700;
    color:var(--sky-dark);
    background:#eaf2fc;
    border-radius:8px;
    padding:12px;
    margin-top:6px;
  }
  .security-box{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:#fff7ec;
    border:1px solid #fadfb8;
    border-radius:8px;
    padding:12px 14px;
    font-size:.82rem;
    color:var(--muted);
  }
  .security-box span.icon{font-size:1.1rem;}
  keygen, .actions{display:block;text-align:center;margin-top:20px;}
  button[type=submit]{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:13px 34px;
    border-radius:999px;
    font-size:.95rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(240,149,74,.4);
  }
</style>
</head>
<body>
    <header>
        <h1>VietAir</h1>
    </header>

    <main>
        <section>
            <h2>Đặt vé máy bay VietAir - Kết quả Bài tập</h2>
            <form action="xu_ly_ve.php" method="POST" id="formDatVe" oninput="tong_tien.value = (Number(hang_ghe.selectedOptions[0]?.dataset.gia || 0) * (Number(nguoi_lon.value)||0)).toLocaleString('vi-VN') + ' VNĐ'">

                <fieldset>
                    <legend>1. Thông tin chuyến bay</legend>

                    <div class="row">
                        <div>
                            <label for="diem_di">Điểm đi</label>
                            <input type="text" name="diem_di" id="diem_di" list="danhsach_thanh_pho" placeholder="Nhập điểm đi">
                        </div>
                        <div>
                            <label for="diem_den">Điểm đến</label>
                            <input type="text" name="diem_den" id="diem_den" list="danhsach_thanh_pho" placeholder="Nhập điểm đến">
                        </div>
                    </div>

                    <datalist id="danhsach_thanh_pho">
                        <option value="Hà Nội – HAN">
                        <option value="TP. Hồ Chí Minh – SGN">
                        <option value="Đà Nẵng – DAD">
                        <option value="Nha Trang – CXR">
                        <option value="Phú Quốc – PQC">
                        <option value="Hải Phòng – HPH">
                        <option value="Cần Thơ – VCA">
                    </datalist>

                    <div class="row">
                        <div>
                            <label for="ngay_di">Ngày đi</label>
                            <input type="date" name="ngay_di" id="ngay_di" required>
                        </div>
                        <div>
                            <label for="ngay_ve">Ngày về</label>
                            <input type="date" name="ngay_ve" id="ngay_ve">
                        </div>
                    </div>

                    <label for="hang_ghe">Hạng ghế</label>
                    <select name="hang_ghe" id="hang_ghe">
                        <optgroup label="Phổ thông">
                            <option value="eco_basic" data-gia="1200000">Phổ thông cơ bản – 1.200.000đ</option>
                            <option value="eco_flex" data-gia="1800000">Phổ thông linh hoạt – 1.800.000đ</option>
                        </optgroup>
                        <optgroup label="Thương gia">
                            <option value="biz" data-gia="4500000">Thương gia – 4.500.000đ</option>
                        </optgroup>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>2. Thông tin hành khách</legend>

                    <div class="row">
                        <div>
                            <label for="nguoi_lon">Số hành khách người lớn</label>
                            <input type="number" name="nguoi_lon" id="nguoi_lon" min="1" max="9" value="1">
                        </div>
                        <div>
                            <label for="tre_em">Số trẻ em</label>
                            <input type="number" name="tre_em" id="tre_em" min="0" max="9" value="0">
                        </div>
                    </div>

                    <label for="ma_giam">Mã giảm giá</label>
                    <input type="text" name="ma_giam" id="ma_giam" placeholder="Nhập mã nếu có" list="ma_uu_dai">
                    <datalist id="ma_uu_dai">
                        <option value="SUMMER20">
                        <option value="NEWMEMBER">
                        <option value="HOLIDAY50">
                    </datalist>
                </fieldset>

                <fieldset>
                    <legend>3. Kết quả ước tính</legend>
                    <label for="tong_tien">Tổng tiền ước tính</label>
                    <output name="tong_tien" id="tong_tien" for="hang_ghe nguoi_lon tre_em">0 VNĐ</output>
                </fieldset>

                <fieldset>
                    <legend>4. Bảo mật giao dịch</legend>
                    <div class="security-box">
                        <span class="icon">🔒</span>
                        <span>Hệ thống sẽ tạo một cặp khóa mã hóa để bảo vệ thông tin của bạn. (Keygen has been deprecated by modern browsers; code only to structure).
                        <!-- Lưu ý: keygen đã bị deprecated ở nhiều trình duyệt mới, chỉ dùng để minh họa khái niệm -->
                        <keygen name="security_key" keytype="rsa"></span>
                    </div>
                </fieldset>

                <div class="actions">
                    <button type="submit">✈ Tìm chuyến bay</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
